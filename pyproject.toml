[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-agent"
version = "0.1.0"
description = "Graph-Based Repository-Level Coding Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "rich>=13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "gitpython>=3.1",
    "pathspec>=0.12",
    "httpx>=0.27",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
]

[project.scripts]
graph-agent = "graph_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
norecursedirs = ["tests/fixtures", ".venv", ".git", "__pycache__", "node_modules"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that need a live DB",
]

[tool.coverage.run]
source = ["graph_agent"]
omit = ["tests/*", "migrations/*"]
